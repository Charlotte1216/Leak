# train_config.yaml
# 训练配置参数

# 训练基本参数
training:
  num_episodes: 5000  # 训练回合数
  max_steps_per_episode: 1000  # 每个回合的最大步数
  save_interval: 100  # 模型保存间隔（回合数）
  eval_interval: 50  # 评估间隔（回合数）
  log_interval: 10  # 日志记录间隔（回合数）
  pretrained_dir: ""  # 继续训练时加载的模型目录（如 ./checkpoints/final）

# MARL 算法配置
marl:
  algorithm: "mappo"  # 可选: "mappo", "qmix"
  
  # MAPPO 特定参数
  mappo:
    gamma: 0.99  # 折扣因子
    gae_lambda: 0.95  # GAE lambda 参数
  
  # QMIX 特定参数
  qmix:
    gamma: 0.99  # 折扣因子
    mixer_lr: 3e-4  # 混合网络学习率
    tau: 0.005  # 软更新参数
    global_state_dim: 8  # 当前环境下建议值= num_agents(2) * state_dim(4)；注意 train.py 里会按实际观测自动覆盖

# 环境配置
environment:
  num_agents: 2  # 智能体数量
  state_dim: 4  # 当前 marl_env 观测默认为 [x, y, conc, battery] 共4维；开启 observe_wind 后会增加 3 维
  action_dim: 8  # 动作维度（8个方向）
  source_find_radius: 5.0  # source find radius
  collision_penalty: 1.0  # collision penalty
  battery_penalty: 0.001  # battery penalty
  found_source_bonus: 20.0  # found source bonus
  done_bonus: 0.0  # 兼容旧配置；若 success_done_bonus 为空则作为成功完成奖励使用
  success_done_bonus: 30.0  # 找到全部源时奖励
  failure_done_penalty: 5.0  # 电池耗尽导致结束时惩罚
  enable_collision: true  # 是否启用与障碍物的碰撞检测/惩罚
  stop_on_collision: false  # 碰撞时是否停止无人机（仅在启用碰撞时生效）
  observe_wind: true  # 观测中是否包含风速与风向 (wind_speed, cos, sin)
  distance_reward_scale: 1  # 距离改善量奖励系数（变近为正，变远为负）
  init_pos_mode: "random"  # init position mode

# 输出配置
output:
  save_dir: "./checkpoints"  # 模型保存目录
  log_dir: "./logs"  # 日志保存目录
  tensorboard_dir: "./runs"  # TensorBoard 日志目录

# 随机种子
seed: 422402
