training:
  num_episodes: 20
  max_steps_per_episode: 200
  save_interval: 1000
  eval_interval: 50
  log_interval: 5
  pretrained_dir: ''
marl:
  algorithm: mappo
  mappo:
    gamma: 0.99
    gae_lambda: 0.95
  qmix:
    gamma: 0.99
    mixer_lr: 3e-4
    tau: 0.005
    global_state_dim: 8
environment:
  num_agents: 4
  state_dim: 4
  action_dim: 8
  source_find_radius: 5.0
  collision_penalty: 1.0
  battery_penalty: 0.001
  found_source_bonus: 20.0
  done_bonus: 0.0
  success_done_bonus: 120.0
  failure_done_penalty: 5.0
  enable_collision: true
  stop_on_collision: false
  observe_wind: true
  observe_velocity: true
  distance_reward_scale: 6
  found_source_concentration_scale: 0.05
  found_source_stay_penalty: 0.15
  found_source_stay_radius_scale: 1.5
  uav_params:
    max_speed: 5.0
    max_acceleration: 1.0
    max_battery: 150.0
    energy_consumption_rate: 0.07
    dt: 1.0
  init_pos_mode: random
  dynamic_field:
    enabled: true
    dt: 1.0
    keep_plume_behind_obstacle: true
    wind:
      enabled: true
      speed_amplitude: 0.0
      speed_frequency: 0.0
      speed_phase: 0.0
      dir_amplitude: 0.0
      dir_frequency: 0.0
      dir_phase: 0.0
    vortex:
      use_strouhal: true
      strouhal: 0.2
      min_wind_speed: 0.001
      min_diameter: 0.001
output:
  save_dir: ./checkpoints/smoke_aux
  log_dir: ./logs/smoke_aux
  tensorboard_dir: ./runs
seed: 123
