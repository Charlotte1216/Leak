network:
  type: ffnn
  hidden_dims:
  - 128
  - 128
  activation: relu
  lstm:
    hidden_dim: 128
    lstm_hidden_dim: 64
    num_layers: 1
  transformer:
    hidden_dim: 128
    num_heads: 4
    num_layers: 2
    seq_len: 10
algorithm: dqn
learning:
  lr: 1.0e-05
  gamma: 0.9
  batch_size: 128
  dqn:
    epsilon: 1.0
    epsilon_min: 0.01
    epsilon_decay: 0.995
    tau: 0.005
    replay_buffer_size: 10000
  ppo:
    clip: 0.2
    epochs: 4
    value_coef: 0.5
    entropy_coef: 0.01
device: cuda
