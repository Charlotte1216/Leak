network:
  type: ffnn
  hidden_dims:
  - 128
  - 128
  activation: relu
  lstm:
    hidden_dim: 128
    lstm_hidden_dim: 64
    num_layers: 1
  transformer:
    hidden_dim: 128
    num_heads: 4
    num_layers: 2
    seq_len: 10
algorithm: ppo
learning:
  lr: 3e-4
  gamma: 0.99
  batch_size: 64
  dqn:
    epsilon: 1.0
    epsilon_min: 0.01
    epsilon_decay: 0.995
    tau: 0.005
    replay_buffer_size: 10000
  ppo:
    clip: 0.2
    epochs: 4
    value_coef: 0.5
    entropy_coef: 0.003
    aux:
      enabled: false
      weight: 0.0
      target_index: 2
      hidden_dim: 128
    lstm_training:
      enabled: false
      seq_len: 32
      stride: 1
device: cuda
network_type: ffnn
